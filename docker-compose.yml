services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webmais
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # Serviços da aplicação: não sobem no `docker compose up -d` padrão (dev usa `pnpm dev`
  # em cada projeto). Só entram com `docker compose --profile full up -d --build`.
  backend:
    profiles: ['full']
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/webmais?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN_HOURS: 8
      EXPIRE_JOB_INTERVAL_MS: 60000
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
    ports:
      - '3000:3000'

  frontend:
    profiles: ['full']
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  postgres_data:
