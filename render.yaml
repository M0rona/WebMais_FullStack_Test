databases:
  - name: webmais-db
    plan: free
    databaseName: webmais
    user: webmais

services:
  - type: web
    name: webmais-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: webmais-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN_HOURS
        value: "8"
      - key: EXPIRE_JOB_INTERVAL_MS
        value: "60000"
      - key: FRONTEND_URL
        sync: false
